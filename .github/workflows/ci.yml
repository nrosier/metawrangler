name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same ref — keeps the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-backend:
    name: Backend — typecheck, lint, audit
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Checks the production dependency tree on every push/PR independently
      # of any image scanning — catches newly disclosed CVEs before they ship.
      # This gate blocks the build: production code ships these dependencies.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      # Dev-only tooling (vitest, eslint, etc.) never ships, so a high/critical
      # finding here can't be exploited in production — but it can still mean
      # a compromised or DoS-able local/CI toolchain, so surface it rather than
      # silently relying on the production-only gate above to catch it later
      # once something gets promoted to a runtime dependency. Policy: visible,
      # non-blocking — don't fail CI on advisories we can't ship a fix for
      # immediately; a human reviews and bumps/overrides on its own schedule.
      - name: Dependency audit (full tree, informational)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

  verify-frontend:
    name: Frontend — typecheck, lint, build, audit
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # A build that typechecks clean but fails to bundle is still broken.
      - name: Build
        run: npm run build

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      # See the matching step in verify-backend for the accept/fail policy.
      - name: Dependency audit (full tree, informational)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

  docs:
    name: Docs consistency check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Catches the two concrete classes of doc rot this repo has hit before
      # (DOC-01, DOC-02): README claiming the wrong container base image, and
      # docs/codebase-survey.md referencing files that have since been
      # renamed/removed. Doesn't catch stale prose generally — see the
      # script's own header.
      - name: Check README/survey against the actual Dockerfiles and file tree
        run: node scripts/check-docs.mjs

  e2e:
    name: E2E — Playwright tests
    runs-on: ubuntu-26.04
    # Run only on main and PRs (not on every push)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Build Docker images for testing
      - name: Build Docker images
        run: |
          docker build -t metawrangler-backend:test -f backend/Dockerfile backend/
          docker build -t metawrangler-frontend:test -f frontend/Dockerfile frontend/

      # Start services via docker compose
      - name: Start services
        run: |
          docker compose -f docker-compose.yml up -d
          # Wait for services to be ready
          timeout 60 bash -c 'until curl -fs http://localhost/health >/dev/null; do sleep 1; done'

      # Run E2E tests
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      # Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/

      # Cleanup
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml down

  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks scans history — needs the full tree.
          fetch-depth: 0

      # Run the image directly: no licence key, and the same command works locally.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest git --redact --verbose --no-banner /repo
