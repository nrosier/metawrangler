name: Docker

# Builds both images (backend + frontend).
#
# Triggers:
#   push tag v*       — full release: semver tags + sha + latest (if not a pre-release)
#   pull_request      — build + smoke-test + scan, never pushed
#   workflow_dispatch — manual: enter a version, choose latest or edge
#
# Tagging strategy:
#   v1.2.3 tag        →  1.2.3, 1.2, 1, sha-<short>, latest
#   v1.2.3-rc.1 tag   →  1.2.3-rc.1, sha-<short>          (no rolling tags)
#   workflow_dispatch →  <input version>, sha-<short>, + latest or edge per input
#   pull request      →  pr-<n>, sha-<short>               (never pushed)
#
# Secrets required (Settings → Secrets → Actions):
#   DOCKERHUB_NAME   — your Docker Hub username
#   DOCKERHUB_TOKEN  — a Docker Hub access token (read/write, repo-scoped)

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - backend/Dockerfile
      - frontend/Dockerfile
      - backend/package.json
      - backend/package-lock.json
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/nginx.conf
      - docker-compose.yml
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g. 1.2.3 or 1.2.3-rc.1) — do not include the leading v"
        required: true
        type: string
      channel:
        description: "Rolling tag to move. 'latest' for stable releases, 'edge' for pre-releases. 'none' to skip."
        required: true
        type: choice
        options:
          - latest
          - edge
          - none
        default: latest

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ secrets.DOCKERHUB_NAME }}
        run: echo "name=${OWNER:-fork-pr-build}/metawrangler-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            # Push tag: semver breakdown
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Manual dispatch: use the version input
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # PR: pr-<n>
            type=ref,event=pr
            # Always: sha-<short> — guarantees at least one valid tag on every run
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=MetaWrangler Backend
            org.opencontainers.image.description=MKV metadata editor — Hono API + mkvpropedit

      - name: Decide rolling tag (latest / edge / none)
        id: rolling
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            channel="${{ inputs.channel }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            channel="latest"
          else
            channel="none"
          fi

          if [[ "$channel" == "none" ]]; then
            echo "tags=" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${channel}" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ github.event_name == 'pull_request' && '(amd64, local)' || 'and push' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.rolling.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false

      - name: Smoke-test the backend image
        if: github.event_name == 'pull_request'
        run: |
          tag="$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run -d --name mw-backend-smoke \
            -e DATA_DIR=/tmp/data \
            -e PORT=3001 \
            -e LOG_LEVEL=info \
            -e ALLOWED_ORIGIN=http://localhost \
            -p 3001:3001 "$tag"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null 2>&1; then
              echo "Backend image healthy."
              docker rm -f mw-backend-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Backend never became healthy. Logs:" >&2
          docker logs mw-backend-smoke >&2
          exit 1

      - name: Scan image for vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  frontend:
    name: Frontend image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ secrets.DOCKERHUB_NAME }}
        run: echo "name=${OWNER:-fork-pr-build}/metawrangler-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=MetaWrangler Frontend
            org.opencontainers.image.description=MKV metadata editor — React + Nginx

      - name: Decide rolling tag (latest / edge / none)
        id: rolling
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            channel="${{ inputs.channel }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            channel="latest"
          else
            channel="none"
          fi

          if [[ "$channel" == "none" ]]; then
            echo "tags=" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${channel}" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ github.event_name == 'pull_request' && '(amd64, local)' || 'and push' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.rolling.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

      - name: Smoke-test the frontend image
        if: github.event_name == 'pull_request'
        run: |
          tag="$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run -d --name mw-frontend-smoke -p 8080:8080 "$tag"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null 2>&1; then
              curl -fsS -I http://127.0.0.1:8080/ | grep -i 'x-content-type-options' \
                || { echo 'Missing X-Content-Type-Options header.' >&2; exit 1; }
              curl -fsS -I http://127.0.0.1:8080/ | grep -i 'x-frame-options' \
                || { echo 'Missing X-Frame-Options header.' >&2; exit 1; }
              echo "Frontend image serves and sets security headers."
              docker rm -f mw-frontend-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Frontend never became healthy. Logs:" >&2
          docker logs mw-frontend-smoke >&2
          exit 1

      - name: Scan image for vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
