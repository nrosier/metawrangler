name: Docker

# Builds both images (backend + frontend) on every version tag and on pull
# requests that touch Docker-related files.
#
# Tagging strategy:
#   v1.2.3 tag  →  1.2.3, 1.2, 1, latest
#   v1.2.3-rc.1 →  1.2.3-rc.1  (no rolling tags, never moves latest)
#   pull request →  built and smoke-tested, never pushed
#
# Secrets required (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  — your Docker Hub username
#   DOCKERHUB_TOKEN     — a Docker Hub access token (read/write, repo-scoped)

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - backend/Dockerfile
      - frontend/Dockerfile
      - backend/package.json
      - backend/package-lock.json
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/nginx.conf
      - docker-compose.yml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${OWNER:-fork-pr-build}/metawrangler-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff9b92742c9ce9ddb74 # v3
      - uses: docker/setup-buildx-action@b5730b3a1de3a0231f8baf97c33ce24f3e02de29 # v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea8a04b6e52b4da9d0f2a25432 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=MetaWrangler Backend
            org.opencontainers.image.description=MKV metadata editor — Hono API + mkvpropedit

      - name: Decide whether this moves latest
        id: latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ github.event_name == 'pull_request' && '(amd64, local)' || 'and push' }}
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: backend
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.latest.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false

      - name: Smoke-test the backend image
        if: github.event_name == 'pull_request'
        run: |
          tag="$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run -d --name mw-backend-smoke \
            -e DATA_DIR=/tmp/data \
            -e PORT=3001 \
            -e LOG_LEVEL=info \
            -e ALLOWED_ORIGIN=http://localhost \
            -p 3001:3001 "$tag"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null 2>&1; then
              echo "Backend image healthy."
              docker rm -f mw-backend-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Backend never became healthy. Logs:" >&2
          docker logs mw-backend-smoke >&2
          exit 1

      - name: Scan image for vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # v0.31.0
        with:
          image-ref: "${{ steps.image.outputs.name }}:pr-${{ github.event.number }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  frontend:
    name: Frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${OWNER:-fork-pr-build}/metawrangler-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff9b92742c9ce9ddb74 # v3
      - uses: docker/setup-buildx-action@b5730b3a1de3a0231f8baf97c33ce24f3e02de29 # v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea8a04b6e52b4da9d0f2a25432 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=MetaWrangler Frontend
            org.opencontainers.image.description=MKV metadata editor — React + Nginx

      - name: Decide whether this moves latest
        id: latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ github.event_name == 'pull_request' && '(amd64, local)' || 'and push' }}
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: frontend
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.latest.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

      - name: Smoke-test the frontend image
        if: github.event_name == 'pull_request'
        run: |
          tag="$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run -d --name mw-frontend-smoke -p 8080:8080 "$tag"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null 2>&1; then
              echo "Frontend image serves."
              docker rm -f mw-frontend-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Frontend never became healthy. Logs:" >&2
          docker logs mw-frontend-smoke >&2
          exit 1

      - name: Scan image for vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # v0.31.0
        with:
          image-ref: "${{ steps.image.outputs.name }}:pr-${{ github.event.number }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
