version: 2
updates:
  # Backend Node dependencies
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      typescript-eslint:
        patterns: ["@typescript-eslint/*"]
      hono:
        patterns: ["hono", "@hono/*"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]

  # Frontend Node dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      typescript-eslint:
        patterns: ["@typescript-eslint/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      react:
        patterns: ["react", "react-dom", "react-router-dom", "@types/react", "@types/react-dom"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
