worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # All temp paths point at /var/cache/nginx (mounted as tmpfs in compose).
  # Using the mount root directly avoids needing to mkdir subdirectories —
  # nginx will create its own numbered temp files directly in these dirs.
  client_body_temp_path  /var/cache/nginx;
  proxy_temp_path        /var/cache/nginx;
  fastcgi_temp_path      /var/cache/nginx;
  uwsgi_temp_path        /var/cache/nginx;
  scgi_temp_path         /var/cache/nginx;

  # Use Docker's embedded DNS so upstream hostnames are resolved lazily at
  # request time rather than at startup — prevents crash when backend starts
  # after the frontend (or isn't present in a local test environment).
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (Traefik also sets these via middleware; belt-and-suspenders)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API → backend ──────────────────────────────────────────────────────────
    # Upstream set as a variable forces nginx to use the resolver above so the
    # host is looked up lazily per-request, not once at startup.
    set $backend http://metawrangler-backend:3001;

    location /api/ {
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass_request_headers on;
    }

    # ── WebSocket → backend ────────────────────────────────────────────────────
    location /ws/ {
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|woff2?|png|ico|svg)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
