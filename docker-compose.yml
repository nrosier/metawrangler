# MetaWrangler — MKV metadata editor
#
# Fits into an existing Traefik + Authentik + DockFlare stack.
# Media volumes are bind-mounted at deploy time — add them under backend.volumes.
# Rename the Traefik hostname labels to match your domain before deploying.

services:
  backend:
    image: ${METAWRANGLER_IMAGE:-niqck/metawrangler-backend:latest}
    container_name: metawrangler-backend
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /data/metawrangler.db
      DATA_DIR: /data
      PORT: "3001"
      LOG_LEVEL: info
    volumes:
      - metawrangler-data:/data
      # Add your media mounts here, e.g.:
      # - /mnt/nas/movies:/media/movies
      # - /mnt/nas/series:/media/series
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    labels:
      # DockFlare — internal service, not exposed directly
      cloudflare.tunnel.enable: "false"

  frontend:
    image: ${METAWRANGLER_FRONTEND_IMAGE:-niqck/metawrangler-frontend:latest}
    container_name: metawrangler-frontend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - proxy
      - internal
    labels:
      # --- Traefik -------------------------------------------------------
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.metawrangler.rule: Host(`metawrangler.example.com`)
      traefik.http.routers.metawrangler.entrypoints: websecure
      traefik.http.routers.metawrangler.tls.certresolver: letsencrypt
      traefik.http.services.metawrangler.loadbalancer.server.port: "8080"
      traefik.http.routers.metawrangler.middlewares: authentik@file
      # --- DockFlare -----------------------------------------------------
      cloudflare.tunnel.enable: "true"
      cloudflare.tunnel.hostname: metawrangler.example.com
      cloudflare.tunnel.service: http://metawrangler-frontend:8080

volumes:
  metawrangler-data:

networks:
  proxy:
    external: true
  internal:
    external: true
