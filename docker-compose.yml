# MetaWrangler alongside an existing Traefik + Authentik + DockFlare stack.
#
# The frontend is the only publicly reachable service — through the
# Cloudflare tunnel and Traefik, behind Authentik forward-auth.
# The backend stays on the internal network; the frontend Nginx proxies
# /api/* and /ws/* to it.
#
# Before deploying:
#   1. Set image names in .env  (cp .env.example .env)
#   2. Replace metawrangler.example.com with your actual domain
#   3. Add your media bind-mounts under backend.volumes
#   4. Ensure the proxy and internal networks exist in your stack

services:
  backend:
    image: ${METAWRANGLER_BACKEND_IMAGE:-metawrangler-backend:latest}
    container_name: metawrangler-backend
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3001"
    volumes:
      - metawrangler-data:/data
      # Add your media mounts here, e.g.:
      # - /mnt/nas/movies:/media/movies
      # - /mnt/nas/series:/media/series
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  frontend:
    image: ${METAWRANGLER_FRONTEND_IMAGE:-metawrangler-frontend:latest}
    container_name: metawrangler-frontend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - proxy
      - internal
    labels:
      # --- Traefik -------------------------------------------------------
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.metawrangler.rule: Host(`metawrangler.example.com`)
      traefik.http.routers.metawrangler.entrypoints: websecure
      traefik.http.routers.metawrangler.tls.certresolver: letsencrypt
      traefik.http.services.metawrangler.loadbalancer.server.port: "8080"
      traefik.http.routers.metawrangler.middlewares: authentik@file
      # --- DockFlare -----------------------------------------------------
      cloudflare.tunnel.enable: "true"
      cloudflare.tunnel.hostname: metawrangler.example.com
      cloudflare.tunnel.service: http://metawrangler-frontend:8080

volumes:
  metawrangler-data:

networks:
  proxy:
    external: true
  internal:
    external: true
